# Bloco Nginx do back_dashboard (API única do painel, ver systemd/back-dashboard.service).
# Reverse proxy de https://painel.example.com para 127.0.0.1:3010 (back_dashboard só escuta
# localhost — RA-010, credenciais/porta nunca expostas direto).
#
# Pré-requisito: registro DNS A de painel.example.com apontando pro IP público da VM vm-painel
# (mesmo IP que já serve auth.example.com) já propagado — confirmar com:
#   dig +short painel.example.com
# antes de seguir (pode levar minutos a horas depois de criado no painel de DNS do provedor, Zone Editor
# do domínio example.com).
#
# Instalação (uma vez, na VM vm-painel, usuário com sudo):
#   sudo cp back-dashboard.conf /etc/nginx/sites-available/painel.example.com
#   sudo ln -s /etc/nginx/sites-available/painel.example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d painel.example.com
#
# O certbot reescreve este arquivo em disco na VM (acrescenta o bloco 443 + redirect 80->443
# automaticamente) — depois disso, qualquer edição manual deve ser conferida com `nginx -t`
# antes de `systemctl reload nginx`. Este arquivo no repositório é só o ponto de partida
# (o estado pré-certbot), não é mais o que roda na VM depois da emissão do certificado.
#
# Operação: journalctl -u nginx -f · /var/log/nginx/access.log · /var/log/nginx/error.log

server {
    listen 80;
    listen [::]:80;
    server_name painel.example.com;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
